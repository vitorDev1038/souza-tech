<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Fundo arredondado preto -->
  <rect width="64" height="64" rx="14" fill="#05070B"/>

  <!-- Anel azul ciano (elipse) -->
  <ellipse cx="32" cy="36" rx="26" ry="8" fill="none" stroke="#00D4FF" stroke-width="3" opacity="0.85"/>

  <!-- Smartphone -->
  <rect x="20" y="8" width="24" height="36" rx="4" fill="#1A2535" stroke="#007BFF" stroke-width="2"/>

  <!-- Chave de fenda (diagonal /) -->
  <line x1="24" y1="30" x2="36" y2="18" stroke="#BFC7D1" stroke-width="2.8" stroke-linecap="round"/>
  <rect x="22.5" y="28.5" width="4" height="4" rx="1" fill="#BFC7D1" transform="rotate(-45 24.5 30.5)"/>

  <!-- Chave inglesa (diagonal \) -->
  <line x1="36" y1="30" x2="24" y2="18" stroke="#BFC7D1" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="36.5" cy="18.5" r="3" fill="none" stroke="#BFC7D1" stroke-width="2"/>

  <!-- Botão home -->
  <circle cx="32" cy="40" r="2" fill="#007BFF"/>

  <!-- Texto ST na base -->
  <text x="32" y="60" font-family="Arial Black, sans-serif" font-size="9" font-weight="900" fill="#007BFF" text-anchor="middle" letter-spacing="1">ST</text>
</svg>
